<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Maldives | Official Tourism Guide</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            background-color: #0b132b;
        }

        /* Фиксированная шапка */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(3, 24, 34, 0.95);
            backdrop-filter: blur(8px); /* Легкий эффект размытия */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: #00b4d8;
            line-height: 1;
            text-decoration: none;
            text-transform: uppercase;
            flex-shrink: 0; /* Логотип не сжимается */
            margin-right: 15px;
        }

        /* Навигация с горизонтальным скроллом для мобильных */
        nav {
            display: flex;
            gap: 15px;
            overflow-x: auto; /* Позволяет листать меню пальцем */
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
        }

        /* Скрываем полосу прокрутки для красоты */
        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 1;
            color: #00b4d8;
        }

        /* Главный баннер */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px; /* Отступ сверху, чтобы меню не перекрывало текст */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
        }

        .tagline {
            color: #00b4d8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 2.2rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 16px;
            max-width: 800px;
        }

        .hero p {
            font-size: 1rem;
            color: #e0e1dd;
            max-width: 500px;
            line-height: 1.5;
        }

        /* Мобильные настройки */
        @media (max-width: 600px) {
            .logo {
                font-size: 0.95rem;
            }

            nav a {
                font-size: 0.78rem;
            }

            .hero h1 {
                font-size: 1.7rem;
            }

            .hero p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Visit<br>Maldives</a>
        <nav>
            <a href="#">Инфо</a>
            <a href="#">Покушать</a>
            <a href="#">Отели</a>
            <a href="#">Экскурсии</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <section class="hero">
        <div class="tagline">Путеводитель</div>
        <h1>Always Natural.<br>Always Maldives.</h1>
        <p>Исследуйте лучшие рестораны, подводные виллы и райские места для отдыха.</p>
    </section>

</body>
</html>
